apiVersion: v1
kind: Pod
metadata:
  name: diagnostic-demo
  labels:
    app: diagnostic-demo
    tier: frontend
    environment: production
spec:
  containers:
    - name: web
      image: nginx:alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
    - name: logger
      image: busybox:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          i=1
          while true; do
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') [INFO] Request batch #$i processed successfully"
            if [ $((i % 5)) -eq 0 ]; then
              echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') [WARN] Elevated latency detected in background sync worker" >&2
            fi
            i=$((i + 1))
            sleep 3
          done
---
apiVersion: v1
kind: Service
metadata:
  name: diagnostic-svc
  labels:
    app: diagnostic-demo
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: diagnostic-demo
