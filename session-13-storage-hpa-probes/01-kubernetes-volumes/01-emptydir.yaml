apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  labels:
    app: emptydir-demo
spec:
  containers:
    - name: writer
      image: busybox:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') [writer] Heartbeat and payload" >> /data/shared.txt;
            sleep 2;
          done
      volumeMounts:
        - name: shared-storage
          mountPath: /data
    - name: reader
      image: busybox:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          sleep 3;
          echo "=== Reader container reading shared emptyDir ===";
          tail -f /data/shared.txt;
      volumeMounts:
        - name: shared-storage
          mountPath: /data
  volumes:
    - name: shared-storage
      emptyDir: {}
