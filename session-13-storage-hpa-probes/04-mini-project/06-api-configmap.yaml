apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-api-config
  namespace: taskflow-prod
data:
  APP_ENV: "production"
  PORT: "8080"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  server.py: |
    import os
    import sys
    import json
    import hashlib
    import socket
    from http.server import HTTPServer, BaseHTTPRequestHandler

    is_ready = True
    tasks = [
        {"id": 1, "title": "Setup Kubernetes Persistent Volumes", "status": "Completed"},
        {"id": 2, "title": "Configure Horizontal Pod Autoscaler", "status": "In Progress"},
        {"id": 3, "title": "Implement Liveness & Readiness Probes", "status": "Completed"}
    ]

    class RequestHandler(BaseHTTPRequestHandler):
        def _send(self, status, payload):
            self.send_response(status)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            self.wfile.write(json.dumps(payload).encode('utf-8'))

        def do_GET(self):
            global is_ready
            if self.path == '/healthz':
                self._send(200, {"status": "alive", "hostname": socket.gethostname()})
            elif self.path == '/ready':
                if is_ready:
                    self._send(200, {"status": "ready", "hostname": socket.gethostname()})
                else:
                    self._send(503, {"status": "unready", "error": "Backend marked unready"})
            elif self.path == '/api/tasks':
                self._send(200, {
                    "hostname": socket.gethostname(),
                    "tasks": tasks,
                    "env": os.environ.get("APP_ENV", "production")
                })
            elif self.path.startswith('/burn'):
                # Compute CPU intensive hash loop to trigger HPA scaling
                val = b"k8s-autoscale-seed"
                for _ in range(80000):
                    val = hashlib.sha256(val).digest()
                self._send(200, {
                    "message": "CPU work completed",
                    "iterations": 80000,
                    "pod": socket.gethostname()
                })
            elif self.path == '/simulate-unready':
                is_ready = False
                self._send(200, {"message": "Readiness probe disabled for this pod"})
            elif self.path == '/simulate-crash':
                self._send(500, {"message": "Crashing container to trigger liveness restart"})
                sys.exit(1)
            else:
                self._send(200, {
                    "message": "TaskFlow Cloud API v1.0",
                    "hostname": socket.gethostname(),
                    "endpoints": ["/healthz", "/ready", "/api/tasks", "/burn", "/simulate-unready", "/simulate-crash"]
                })

        def do_POST(self):
            if self.path == '/api/tasks':
                length = int(self.headers.get('Content-Length', 0))
                body = self.rfile.read(length) if length > 0 else b'{}'
                try:
                    data = json.loads(body.decode('utf-8'))
                except Exception:
                    data = {"title": "Default Task"}
                data["id"] = len(tasks) + 1
                tasks.append(data)
                self._send(201, {"message": "Task added", "task": data})
            else:
                self._send(404, {"error": "Not found"})

        def log_message(self, format, *args):
            return # Quiet logging

    if __name__ == '__main__':
        port = int(os.environ.get("PORT", 8080))
        server = HTTPServer(('0.0.0.0', port), RequestHandler)
        print(f"TaskFlow API running on port {port}")
        server.serve_forever()
