apiVersion: v1
kind: Pod
metadata:
  name: liveness-exec-demo
  labels:
    app: liveness-exec-demo
spec:
  containers:
    - name: liveness-worker
      image: busybox:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          touch /tmp/healthy;
          echo "Pod healthy, created /tmp/healthy at $(date)";
          sleep 15;
          rm -rf /tmp/healthy;
          echo "Simulated failure: deleted /tmp/healthy at $(date)";
          sleep 600;
      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/healthy
        initialDelaySeconds: 5
        periodSeconds: 3
        failureThreshold: 2
