apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskpulse-api
  namespace: cicd-demo
  labels:
    app: taskpulse-api
    managed-by: github-actions
    pipeline: enterprise-cicd
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: taskpulse-api
  template:
    metadata:
      labels:
        app: taskpulse-api
    spec:
      containers:
        - name: taskpulse-api
          image: taskpulse-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: BUILD_NUMBER
              value: "gha-build-24bcs10237"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
