name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    branches: [ main ]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================
  # Job 1: Build & Package Production Docker Image
  # =========================================================
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/taskpulse-api
          tags: |
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false  # set true when remote registry credentials are live
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================
  # Job 2: Deploy to Kubernetes Cluster & Smoke Test
  # =========================================================
  deploy-to-k8s:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Kubernetes Context
        run: |
          echo "Simulating cluster connection via secrets.KUBECONFIG"
          mkdir -p ~/.kube
          # In live CI: echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Create or Update Namespace
        run: |
          echo "Applying namespace: cicd-demo"
          kubectl create namespace cicd-demo --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      - name: Await Zero-Downtime Rollout
        run: |
          kubectl rollout status deployment/taskpulse-api -n cicd-demo --timeout=90s

      - name: Post-Deployment Smoke Verification
        run: |
          echo "Running post-deploy health check..."
          kubectl get pods,svc -n cicd-demo -l app=taskpulse-api
