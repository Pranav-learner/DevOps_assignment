apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudstore-chart.fullname" . }}-config
  labels:
    {{- include "cloudstore-chart.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | default "production" | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | default "info" | quote }}
  API_TIMEOUT_SECONDS: {{ .Values.config.apiTimeout | default "30" | quote }}
  CACHE_ENABLED: {{ .Values.config.cacheEnabled | default "true" | quote }}
  CATALOG_PAGE_SIZE: {{ .Values.config.catalogPageSize | default "25" | quote }}
