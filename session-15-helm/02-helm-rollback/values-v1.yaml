# Values for Release Revision 1 (Initial Stable Baseline)
replicaCount: 2

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "1.24-alpine"

service:
  type: ClusterIP
  port: 80

env:
  - name: APP_ENVIRONMENT
    value: "production"
  - name: APP_VERSION
    value: "v1.0.0-stable"
  - name: RELEASE_CODENAME
    value: "genesis"

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
