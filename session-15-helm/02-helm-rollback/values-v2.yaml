# Values for Release Revision 2 (Feature Update & Scale Out)
replicaCount: 3

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "1.25-alpine"

service:
  type: ClusterIP
  port: 80

env:
  - name: APP_ENVIRONMENT
    value: "production"
  - name: APP_VERSION
    value: "v2.0.0-feature"
  - name: RELEASE_CODENAME
    value: "evolution"

resources:
  requests:
    cpu: 25m
    memory: 40Mi
  limits:
    cpu: 150m
    memory: 80Mi
