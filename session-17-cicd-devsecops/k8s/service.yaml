apiVersion: v1
kind: Service
metadata:
  name: vaultshield-service
  namespace: devsecops-prod
  labels:
    app: vaultshield-api
    security.policy: restricted
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: vaultshield-api
