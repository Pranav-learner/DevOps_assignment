apiVersion: v1
kind: Service
metadata:
  name: pranav-app-service
  namespace: pranav-prod
  labels:
    app: pranav-app-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: pranav-app-api
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
