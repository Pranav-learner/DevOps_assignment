apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudnexus-ingress
  namespace: cloudnexus-prod
  labels:
    app: cloudnexus-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: cloudnexus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudnexus-service
                port:
                  number: 80
