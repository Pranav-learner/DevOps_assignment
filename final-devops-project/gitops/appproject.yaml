apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pranav-app-project
  namespace: argocd
spec:
  description: "Pranav Production GitOps Management Project"
  sourceRepos:
    - "https://github.com/Pranav-learner/DevOps_assignment.git"
  destinations:
    - namespace: pranav-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
