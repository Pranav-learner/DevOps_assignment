apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pranav-production
  namespace: argocd
  labels:
    env: production
    app.kubernetes.io/managed-by: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pranav-learner/DevOps_assignment.git
    targetRevision: main
    path: final-devops-project/helm/pranav-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pranav-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
