apiVersion: apps/v1
kind: Deployment
metadata:
  name: pranav-troubleshoot-imagepull
  namespace: pranav-prod
  labels:
    app: troubleshoot-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: troubleshoot-2
  template:
    metadata:
      labels:
        app: troubleshoot-2
    spec:
      containers:
        - name: app
          # INTENTIONAL BUG: Non-existent image tag triggers ErrImagePull / ImagePullBackOff
          image: pranav:v9.9.99-nonexistent
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_PASSWORD
              value: "demo-pass"
