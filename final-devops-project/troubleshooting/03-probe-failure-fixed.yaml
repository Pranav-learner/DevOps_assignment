apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnexus-troubleshoot-probe
  namespace: cloudnexus-prod
  labels:
    app: troubleshoot-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: troubleshoot-3
  template:
    metadata:
      labels:
        app: troubleshoot-3
    spec:
      containers:
        - name: app
          image: cloudnexus:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_PASSWORD
              value: "demo-pass"
          readinessProbe:
            httpGet:
              # REMEDIATION: Correct path to /ready endpoint
              path: /ready
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 3
