replicaCount: 3

image:
  repository: pranav-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  host: "pranav.local"
  path: "/"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce

probes:
  startup:
    path: /healthz
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 10
  liveness:
    path: /healthz
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

env:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  ENABLE_METRICS: "true"
  CACHE_TTL: "3600"

secrets:
  DB_PASSWORD: "SuperSecureProductionPassword2026!"
  API_SECRET_KEY: "pranav-jwt-hs256-signature-key"
