apiVersion: v1
kind: Service
metadata:
  name: {{ include "pranav.fullname" . }}-service
  labels:
    {{- include "pranav.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.service.targetPort | quote }}
    prometheus.io/path: "/metrics"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "pranav.selectorLabels" . | nindent 4 }}
