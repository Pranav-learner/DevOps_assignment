name: CloudNexus End-to-End DevSecOps & GitOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cloudnexus
  APP_DIR: final-devops-project/application

jobs:
  # ---------------------------------------------------------------------------
  # 1. BUILD & UNIT TEST
  # ---------------------------------------------------------------------------
  build-and-test:
    name: "Stage 1: Build & Unit Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Run Unit & Integration Tests (Jest)
        working-directory: ${{ env.APP_DIR }}
        run: npm test -- --coverage --ci

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: ${{ env.APP_DIR }}/coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. DEVSECOPS: SAST, SCA & SECRET SCANNING
  # ---------------------------------------------------------------------------
  devsecops-code-scan:
    name: "Stage 2: SAST, SCA & Secret Scanning"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Run SAST Security Scan (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
        continue-on-error: false

      - name: Run SCA Vulnerability Scan (Trivy Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.APP_DIR }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ---------------------------------------------------------------------------
  # 3. CONTAINER BUILD & IMAGE SECURITY SCANNING
  # ---------------------------------------------------------------------------
  container-build-and-scan:
    name: "Stage 3: Docker Build & Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: devsecops-code-scan
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image Locally
        uses: docker/build-push-action@v5
        with:
          context: final-devops-project/application
          file: final-devops-project/docker/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan Docker Image for Vulnerabilities (Trivy Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container Image to Registry
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: final-devops-project/application
          file: final-devops-project/docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ---------------------------------------------------------------------------
  # 4. INFRASTRUCTURE & HELM VALIDATION
  # ---------------------------------------------------------------------------
  infra-and-helm-lint:
    name: "Stage 4: Terraform & Helm Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Validate Terraform Syntax & Configuration
        working-directory: final-devops-project/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint CloudNexus Helm Chart
        run: |
          helm lint final-devops-project/helm/cloudnexus
          helm template cloudnexus final-devops-project/helm/cloudnexus > /dev/null

  # ---------------------------------------------------------------------------
  # 5. GITOPS CONTINUOUS DEPLOYMENT TRIGGER
  # ---------------------------------------------------------------------------
  gitops-deploy:
    name: "Stage 5: GitOps Manifest Reconciliation"
    runs-on: ubuntu-latest
    needs: [container-build-and-scan, infra-and-helm-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update GitOps Deployment Tag
        run: |
          echo "Updating GitOps repository image tag to: ${{ github.sha }}"
          sed -i 's|tag: ".*"|tag: "${{ github.sha }}"|' final-devops-project/helm/cloudnexus/values.yaml

      - name: Commit & Push GitOps State Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add final-devops-project/helm/cloudnexus/values.yaml
          if git diff --staged --quiet; then
            echo "No GitOps changes to commit."
          else
            git commit -m "chore(gitops): update release image tag to ${{ github.sha }} [skip ci]"
            git push
          fi
