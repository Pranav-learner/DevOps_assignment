apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsewatch-api
  namespace: observability-demo
  labels:
    app: pulsewatch-api
    tier: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulsewatch-api
  template:
    metadata:
      labels:
        app: pulsewatch-api
        tier: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: pulsewatch
          image: pulsewatch:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 400m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
